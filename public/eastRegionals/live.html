
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>East Regionals - Live</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111827;
      --panel-2: #0f172a;
      --panel-3: #1e293b;
      --border: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --link: #93c5fd;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.16);

      --bronze: rgba(180, 83, 9, 0.18);
      --ok: #16a34a;
      --warn: #ca8a04;
      --dim: #64748b;
      --changed: #2563eb;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      min-height: 100%;

    body {
      display: flex;

    }

    a {

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: linear-gradient(180deg, rgba(15,23,42,0.98), rgba(15,23,42,0.96));
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }

    .topbar-inner {
      max-width: 1600px;
      margin: 0 auto;
      padding: 18px 20px 16px;
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .page-title {

      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.02em;

    }

    .controls-row {

    }

    .search-wrap {

    }

    .search {

    }

    .search:focus {

      box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
    }

    .toggle-row {

    }

    .toggle {

      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 12px;

    .app-shell {

    .sidebar,

    .sidebar {
      display: flex;

    .sidebar-header {

    .sidebar-title {

    .sidebar-subtitle {

    .event-header {

    .content-shell {

    .detail-pane {

    .race-detail-header {

    .race-detail-sub {

    .detail-actions {

    .btn-link {

      justify-content: center;

      border-radius: 12px;

      background: var(--panel-3);

    .detail-note {

    .table-wrap {
      width: 100%;

    table {

    .summary-panel {

    .summary-title {
      margin: 0 0 12px 0;

    .summary-note {
      font-size: 12px;

    .summary-table-wrap {

      border: 1px solid var(--border);

    .mobile-inline-detail {
      display: none;

      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(2,6,23,0.35);

    .error-box,

      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--shadow);

      color: #fecaca;
      border-color: rgba(239,68,68,0.35);
    }

    .hide {
      display: none !important;
    }

    @media (max-width: 900px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .content-shell {
        grid-template-rows: auto auto;
      }

      .detail-pane {
        display: none !important;
      }

      .mobile-inline-detail {
        display: block;
      }

      .race-detail-title {
        font-size: 22px;
      }

      .page-title {
        font-size: 24px;
      }

    }
  </style>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="title-row">
        <div>
          <h1 class="page-title" id="meetTitle">East Regionals - Live</h1>
        </div>
      </div>

      <div class="controls-row">
        <div class="search-wrap">
          <input id="search" class="search" placeholder="Search events, divisions, athletes, schools..." />
        </div>
        <div class="toggle-row">
          <label class="toggle">
            <input type="checkbox" id="postedOnly" checked />
            <span>Posted only</span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="partialVisible" />
            <span>Include partial</span>
          </label>
        </div>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Meet Browser</h2>
        <div class="sidebar-subtitle" id="sidebarMeta">Loading event navigation...</div>
      </div>
      <div class="nav-scroll" id="sidebar"></div>
    </aside>

    <section class="content-shell">
      <div class="detail-pane" id="detailPane">
        <div class="detail-empty">
          <div>
            <div style="font-size:18px;font-weight:700;margin-bottom:8px;">No race selected</div>
            <div>Select an event and race from the left to view results.</div>
          </div>
        </div>
      </div>

      <div class="summary-panel">
        <h3 class="summary-title">School Summary</h3>
        <div class="summary-note">
          Based on fully posted races only. Sorted by wins, then top 3 finishes, then entries.
        </div>
        <div id="schoolSummary" class="summary-table-wrap">
          <div class="loading-box">Loading school summary...</div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const SUPABASE_URL = "https://sclhzmgdafotyiynrjwr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjbGh6bWdkYWZvdHlpeW5yandyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzExNDIyMzMsImV4cCI6MjA4NjcxODIzM30.lNrQF2Bpe7f2dno0rZ9XzqGSzyFi3vwKkLny8VPnBH8";
    const MEET_KEY = "ofsaa-east-regionals-2026";
    const REFRESH_MS = 60000;

    const meetTitleEl = document.getElementById("meetTitle");
    const sidebarEl = document.getElementById("sidebar");
    const sidebarMetaEl = document.getElementById("sidebarMeta");
    const detailPaneEl = document.getElementById("detailPane");
    const schoolSummaryEl = document.getElementById("schoolSummary");
    const searchEl = document.getElementById("search");
    const postedOnlyEl = document.getElementById("postedOnly");
    const partialVisibleEl = document.getElementById("partialVisible");

    let currentData = null;
    let currentGrouped = [];
    let selectedRaceUrl = null;
    let expandedFamilies = new Set();

    function esc(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function isMobileLayout() {
      return window.innerWidth <= 900;
    }

    function getEventFamilySortKey(eventFamily) {
      const ef = String(eventFamily || "").trim().toLowerCase();

      const trackOrder = [
        "100 meter",
        "80 meter hurdles",
        "100 meter hurdles",
        "200 meter",
        "400 meter",
        "300 meter hurdles",
        "400 meter hurdles",
        "800 meter",
        "1500 meter",
        "3000 meter",
        "2000 meter steeplechase",
        "4x100 meter relay",
        "4x400 meter relay",
        "mixed 4x400 meter relay",
      ];

      const fieldOrder = [
        "high jump",
        "pole vault",
        "long jump",
        "triple jump",
        "shot put",
        "discus throw",
        "javelin throw",
      ];

      const paraOrder = [
        "100 meter ambulatory",
        "100 meter wheelchair",
        "200 meter wheelchair",
        "400 meter ambulatory",
        "shot put ambulatory",
        "shot put wheelchair",
        "long jump ambulatory",
      ];

      const ordered = [...trackOrder, ...fieldOrder, ...paraOrder];
      const idx = ordered.indexOf(ef);
      if (idx !== -1) return [idx, ef];

      const m = ef.match(/(\d+)\s*meter/);
      if (m) {
        const dist = parseInt(m[1], 10);
        const hurdles = ef.includes("hurdles");
        const relay = ef.includes("relay");
        const steeple = ef.includes("steeple");

        if (relay) return [5000, ef];
        if (hurdles) return [2000 + dist, ef];
        if (steeple) return [3000 + dist, ef];
        return [1000 + dist, ef];
      }

      if (ef.includes("jump") || ef.includes("vault")) return [6000, ef];
      if (ef.includes("shot put") || ef.includes("discus") || ef.includes("javelin") || ef.includes("throw")) return [7000, ef];

      return [9999, ef];
    }

    function raceLabel(race) {
      const parts = [];
      if (race.gender) parts.push(race.gender);
      if (race.category) parts.push(race.category);
      let label = parts.join(" ");
      if (!label) label = race.race_name || "Race";
      if (race.phase) label += ` - ${race.phase}`;
      return label;
    }

    function isPlaceholder(value) {
      const v = String(value ?? "").trim().toUpperCase();
      return v === "" || v === "-" || v === "--";
    }

    function clientEffectiveStatus(race) {
      const results = race.results || [];
      const headers = race.headers || [];
      if (!results.length) return "not_posted";

      const preferred = ["Time", "Mark", "Result", "Performance", "Distance", "Height", "Best"];
      const presentPreferred = headers.filter(h => preferred.includes(h));

      if (presentPreferred.length) {
        for (const row of results) {
          for (const col of presentPreferred) {
            if (!isPlaceholder(row[col])) return "posted";
          }
        }
      }

      const ignored = new Set(["Place", "Name", "Bib", "School", "Team", "Heat", "Lane"]);
      for (const row of results) {
        if (/^\d+$/.test(String(row.Place || "").trim())) return "posted";
        for (const [k, v] of Object.entries(row)) {
          if (ignored.has(k)) continue;
          if (!isPlaceholder(v)) return "posted";
        }
      }

      return race.status || "partial";
    }

    function groupRacesByEventFamily(races) {
      const grouped = new Map();

      for (const race of races || []) {
        const family = race.event_family || race.race_name || "Other";
        if (!grouped.has(family)) grouped.set(family, []);
        grouped.get(family).push(race);
      }

      const categoryOrder = {
        "Novice": 1,
        "Junior": 2,
        "Senior": 3,
        "Wheelchair": 4,
        "Ambulatory": 5,
        "Intellectually Impaired": 6,
        "Open": 7,
        "Other": 99,
      };

      const genderOrder = {
        "Women": 1,
        "Men": 2,
        "Mixed": 3,
        "Other": 99,
      };

      const phaseOrder = {
        "": 0,
        "Preliminaries": 1,
        "Semi-Finals": 2,
        "Semifinals": 2,
        "Finals": 3,
        "Final": 3,
      };

      return [...grouped.entries()]
        .map(([family, races]) => {
          const sorted = [...races].sort((a, b) => {
            const catA = categoryOrder[a.category || "Other"] ?? 99;
            const catB = categoryOrder[b.category || "Other"] ?? 99;
            if (catA !== catB) return catA - catB;

            const genA = genderOrder[a.gender || "Other"] ?? 99;
            const genB = genderOrder[b.gender || "Other"] ?? 99;
            if (genA !== genB) return genA - genB;

            const phA = phaseOrder[a.phase || ""] ?? 50;
            const phB = phaseOrder[b.phase || ""] ?? 50;
            if (phA !== phB) return phA - phB;

            return (a.race_name || "").localeCompare(b.race_name || "");
          });

          return [family, sorted];
        })
        .sort((a, b) => {
          const ka = getEventFamilySortKey(a[0]);
          const kb = getEventFamilySortKey(b[0]);
          if (ka[0] !== kb[0]) return ka[0] - kb[0];
          return ka[1].localeCompare(kb[1]);
        });
    }

    function buildSchoolSummary(flatRows) {
      const map = new Map();

      for (const row of flatRows || []) {
        const school = (row.School || "").trim();
        const place = String(row.Place || "").trim();
        const event = (row.race_name || "").trim();

        if (!school) continue;

        if (!map.has(school)) {
          map.set(school, {
            school,
            entries: 0,
            top3: 0,
            wins: 0,
            events: new Set(),
          });
        }

        const item = map.get(school);
        item.entries += 1;
        if (event) item.events.add(event);

        if (/^\d+$/.test(place)) {
          const p = parseInt(place, 10);
          if (p === 1) item.wins += 1;
          if (p <= 3) item.top3 += 1;
        }
      }

      return [...map.values()]
        .map(x => ({
          school: x.school,
          entries: x.entries,
          top3: x.top3,
          wins: x.wins,
          events: x.events.size,
        }))
        .sort((a, b) =>
          b.wins - a.wins ||
          b.top3 - a.top3 ||
          b.entries - a.entries ||
          a.school.localeCompare(b.school)
        );
    }

    function statusClass(status) {
      if (status === "posted") return "status-posted";
      if (status === "partial") return "status-partial";
      if (status === "not_posted") return "status-not_posted";
      return "";
    }

    function raceMatchesFilters(race, q, postedOnly, includePartial) {
      const effectiveStatus = clientEffectiveStatus(race);

      const hay = [
        race.event_family,
        race.race_name,
        race.gender,
        race.category,
        race.kind,
        race.phase,
        effectiveStatus,
        ...(race.results || []).flatMap(row => Object.values(row || {}))
      ].join(" ").toLowerCase();

      if (q && !hay.includes(q)) return false;
      if (postedOnly && effectiveStatus !== "posted") return false;
      if (!includePartial && effectiveStatus === "partial") return false;

      return true;
    }

    function getFilteredGrouped() {
      const q = (searchEl.value || "").trim().toLowerCase();
      const postedOnly = postedOnlyEl.checked;
      const includePartial = partialVisibleEl.checked;

      return currentGrouped
        .map(([family, races]) => {
          const visible = races.filter(race => raceMatchesFilters(race, q, postedOnly, includePartial));
          return [family, visible];
        })
        .filter(([, races]) => races.length > 0);
    }

    function findRaceByUrl(url) {
      if (!currentData?.races) return null;
      return currentData.races.find(r => r.url === url) || null;
    }

function renderRaceTable(race) {
  if (!race.headers?.length || !race.results?.length) {
    return `<div class="detail-empty" style="min-height:240px;"><div><div style="font-size:18px;font-weight:700;margin-bottom:8px;">No results table yet</div><div>This race has not published a table yet.</div></div></div>`;
  }

  if (isMobileLayout()) {
    const perfKey =
      ["Time", "Mark", "Result", "Performance", "Distance", "Height", "Best"]
        .find(k => race.headers.includes(k)) || null;

    return `
      <div class="mobile-compact-results">
        ${race.results.map(row => {
          const place = String(row["Place"] || "").trim();
          let cls = "";
          if (place === "1") cls = "gold";
          else if (place === "2") cls = "silver";
          else if (place === "3") cls = "bronze";

          const name = row["Name"] || "";
          const school = row["School"] || row["Team"] || "";
          const bib = row["Bib"] ? `Bib ${row["Bib"]}` : "";
          const heat = row["Heat"] ? `Heat ${row["Heat"]}` : "";
          const lane = row["Lane"] ? `Lane ${row["Lane"]}` : "";
          const perf = perfKey ? (row[perfKey] || "") : "";

          const meta = [school, bib, heat, lane, perf].filter(Boolean).join(" • ");

          return `
            <div class="mobile-compact-row ${cls}">
              <div class="mobile-compact-line1">
                ${place ? `<span class="mobile-place">${esc(place)}</span>` : ""}
                <span class="mobile-name">${esc(name)}</span>
              </div>
              <div class="mobile-compact-line2">${esc(meta)}</div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  const head = `
    <thead>
      <tr>
        ${race.headers.map(h => `<th>${esc(h)}</th>`).join("")}
      </tr>
    </thead>
  `;

  const body = `
    <tbody>
      ${race.results.map(row => {
        const place = String(row["Place"] || "").trim();
        let cls = "";
        if (place === "1") cls = "gold";
        else if (place === "2") cls = "silver";
        else if (place === "3") cls = "bronze";

        return `
          <tr class="${cls}">
            ${race.headers.map(h => `<td>${esc(row[h] ?? "")}</td>`).join("")}
          </tr>
        `;
      }).join("")}
    </tbody>
  `;

  return `
    <div class="table-wrap">
      <table>
        ${head}
        ${body}
      </table>
    </div>
  `;
}
    function renderRaceDetailContent(race) {
      const effectiveStatus = clientEffectiveStatus(race);

      const chips = [
        `<span class="chip">${esc(race.gender || "Other")}</span>`,
        `<span class="chip">${esc(race.category || "Other")}</span>`,
        `<span class="chip">${esc(race.kind || "Other")}</span>`,
        race.phase ? `<span class="chip">${esc(race.phase)}</span>` : "",
        `<span class="chip ${statusClass(effectiveStatus)}">${esc(effectiveStatus)}</span>`,
        race.just_changed ? `<span class="chip status-changed">changed this poll</span>` : "",
      ].filter(Boolean).join("");

      return `
        <div class="race-detail-header">
          <div>
            <h2 class="race-detail-title">${esc(race.race_name)}</h2>
            <div class="race-detail-sub">${esc(race.event_family || "")}</div>
          </div>

          <div class="detail-actions">
            <a class="btn-link" href="${esc(race.url)}" target="_blank" rel="noreferrer">Open on CSTiming</a>
          </div>
        </div>

        <div class="chip-row">${chips}</div>

        <div class="detail-note">
          Last seen: ${esc(race.last_seen || "")}
        </div>

        ${renderRaceTable(race)}
      `;
    }

    function renderDetailPane() {
      if (isMobileLayout()) {
        detailPaneEl.classList.add("hide");
        return;
      }

      detailPaneEl.classList.remove("hide");

      const race = findRaceByUrl(selectedRaceUrl);

      if (!race) {
        detailPaneEl.innerHTML = `
          <div class="detail-empty">
            <div>
              <div style="font-size:18px;font-weight:700;margin-bottom:8px;">No race selected</div>
              <div>Select an event and race from the left to view results.</div>
            </div>
          </div>
        `;
        return;
      }

      detailPaneEl.innerHTML = renderRaceDetailContent(race);
    }

    function renderSidebar() {
      const grouped = getFilteredGrouped();
      sidebarMetaEl.textContent = `${grouped.length} event groups`;

      if (!grouped.length) {
        sidebarEl.innerHTML = `<div class="loading-box">No events match your current filters.</div>`;
        return;
      }

      sidebarEl.innerHTML = grouped.map(([family, races]) => {
        const expanded = expandedFamilies.has(family);
        const postedCount = races.filter(r => clientEffectiveStatus(r) === "posted").length;
        const partialCount = races.filter(r => clientEffectiveStatus(r) === "partial").length;

        return `
          <section class="event-group ${expanded ? "expanded" : ""}" data-family="${esc(family)}">
            <button class="event-header" data-action="toggle-family" data-family="${esc(family)}">
              <div>
                <div class="event-family-name">${esc(family)}</div>
                <div class="event-family-meta">
                  ${races.length} race${races.length === 1 ? "" : "s"} • ${postedCount} posted${partialCount ? ` • ${partialCount} partial` : ""}
                </div>
              </div>
              <div class="event-chevron">▶</div>
            </button>

            <div class="race-list">
              ${races.map(race => {
                const effectiveStatus = clientEffectiveStatus(race);
                const isSelected = race.url === selectedRaceUrl;

                return `
                  <div class="race-entry">
                    <button
                      class="race-item ${isSelected ? "active" : ""}"
                      data-action="select-race"
                      data-race-url="${esc(race.url)}"
                    >
                      <div>
                        <div class="race-label">${esc(raceLabel(race))}</div>
                        <div class="race-meta">
                          ${esc(effectiveStatus)}${race.row_count ? ` • ${esc(race.row_count)} rows` : ""}
                        </div>
                      </div>
                      <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
                        <span class="status-badge ${statusClass(effectiveStatus)}">${esc(effectiveStatus)}</span>
                        ${race.just_changed ? `<span class="status-badge status-changed">changed</span>` : ``}
                      </div>
                    </button>

                    ${isMobileLayout() && isSelected ? `
                      <div class="mobile-inline-detail">
                        ${renderRaceDetailContent(race)}
                      </div>
                    ` : ""}
                  </div>
                `;
              }).join("")}
            </div>
          </section>
        `;
      }).join("");
    }

    function renderSchoolSummary(flatRows) {
      const summary = buildSchoolSummary(flatRows);

      if (!summary.length) {
        schoolSummaryEl.innerHTML = `<div class="loading-box">No posted race results yet.</div>`;
        return;
      }

      schoolSummaryEl.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>School</th>
              <th>Wins</th>
              <th>Top 3</th>
              <th>Entries</th>
              <th>Events</th>
            </tr>
          </thead>
          <tbody>
            ${summary.map(row => `
              <tr>
                <td>${esc(row.school)}</td>
                <td>${esc(row.wins)}</td>
                <td>${esc(row.top3)}</td>
                <td>${esc(row.entries)}</td>
                <td>${esc(row.events)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function chooseDefaultSelection() {
      const grouped = getFilteredGrouped();
      if (!grouped.length) {
        selectedRaceUrl = null;
        return;
      }

      const allVisible = grouped.flatMap(([, races]) => races);

      if (selectedRaceUrl && allVisible.some(r => r.url === selectedRaceUrl)) {
        return;
      }

      const firstPosted = allVisible.find(r => clientEffectiveStatus(r) === "posted");
      const firstPartial = allVisible.find(r => clientEffectiveStatus(r) === "partial");
      const firstAny = allVisible[0];

      const chosen = firstPosted || firstPartial || firstAny || null;
      selectedRaceUrl = chosen?.url || null;

      if (chosen?.event_family) {
        expandedFamilies.clear();
        expandedFamilies.add(chosen.event_family);
      }
    }

    function syncExpandedFamilies() {
      const grouped = getFilteredGrouped();
      const visibleFamilies = new Set(grouped.map(([family]) => family));

      for (const family of [...expandedFamilies]) {
        if (!visibleFamilies.has(family)) expandedFamilies.delete(family);
      }

      if (!expandedFamilies.size && grouped.length) {
        expandedFamilies.add(grouped[0][0]);
      }

      const selectedRace = findRaceByUrl(selectedRaceUrl);
      if (selectedRace?.event_family) {
        expandedFamilies.clear();
        expandedFamilies.add(selectedRace.event_family);
      }
    }

    async function fetchLiveMeet() {
      const url = `${SUPABASE_URL}/rest/v1/live_meet_snapshots?meet_key=eq.${encodeURIComponent(MEET_KEY)}&select=payload`;

      const res = await fetch(url, {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        },
      });

      if (!res.ok) {
        throw new Error(`Failed to fetch live meet: HTTP ${res.status}`);
      }

      const rows = await res.json();
      return rows[0]?.payload ?? null;
    }

    function rerenderAll() {
      if (!currentData) return;
      currentGrouped = groupRacesByEventFamily(currentData.races || []);
      syncExpandedFamilies();
      chooseDefaultSelection();
      renderSidebar();
      renderDetailPane();
      renderSchoolSummary(currentData.flat_rows || []);
    }

    async function loadData() {
      try {
        const data = await fetchLiveMeet();

        if (!data) {
          meetTitleEl.textContent = "East Regionals - Live";
          sidebarMetaEl.textContent = "No data";
          sidebarEl.innerHTML = `<div class="loading-box">No live data found.</div>`;
          detailPaneEl.innerHTML = `<div class="error-box">No snapshot was returned from Supabase.</div>`;
          schoolSummaryEl.innerHTML = `<div class="loading-box">No school summary available yet.</div>`;
          return;
        }

        currentData = data;
        meetTitleEl.textContent = "East Regionals - Live";
        rerenderAll();
      } catch (err) {
        detailPaneEl.innerHTML = `<div class="error-box">${esc(err.message || String(err))}</div>`;
      }
    }

    sidebarEl.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;

      const action = btn.getAttribute("data-action");

      if (action === "toggle-family") {
        const family = btn.getAttribute("data-family");
        if (!family) return;

        if (expandedFamilies.has(family)) {
          expandedFamilies.delete(family);
        } else {
          expandedFamilies.clear();
          expandedFamilies.add(family);
        }

        if (isMobileLayout()) {
          selectedRaceUrl = null;
        }

        renderSidebar();
        renderDetailPane();
        return;
      }

      if (action === "select-race") {
        const url = btn.getAttribute("data-race-url");
        if (!url) return;

        if (isMobileLayout() && selectedRaceUrl === url) {
          selectedRaceUrl = null;
        } else {
          selectedRaceUrl = url;
          const race = findRaceByUrl(url);
          if (race?.event_family) {
            expandedFamilies.clear();
            expandedFamilies.add(race.event_family);
          }
        }

        renderSidebar();
        renderDetailPane();
      }
    });

    searchEl.addEventListener("input", () => {
      rerenderAll();
    });

    postedOnlyEl.addEventListener("change", () => {
      rerenderAll();
    });

    partialVisibleEl.addEventListener("change", () => {
      rerenderAll();
    });

    window.addEventListener("resize", () => {
      renderSidebar();
      renderDetailPane();
    });

    loadData();
    setInterval(loadData, REFRESH_MS);
  </script>
</body>
</html>
