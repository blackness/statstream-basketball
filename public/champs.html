<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2025 KPRDSB Championship Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;0,800;0,900;1,700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #111116;
    --surface2: #18181f;
    --border: #222230;
    --gold: #f5c842;
    --silver: #c0c8d8;
    --bronze: #d97a3a;
    --accent: #e8f020;
    --accent2: #20e8c8;
    --text: #e8e8f0;
    --muted: #666680;
    --female: #ff6eb0;
    --male: #5ba8ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,240,32,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,240,32,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  .hero {
    position: relative;
    z-index: 1;
    padding: 60px 40px 40px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(232,240,32,0.04) 0%, transparent 100%);
  }

  .hero-year {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.4em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.1s;
  }

  .hero-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 900;
    line-height: 0.9;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    color: var(--text);
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.2s;
  }

  .hero-title span {
    color: var(--accent);
    display: block;
  }

  .hero-sub {
    font-size: 14px;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 16px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.35s;
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 48px;
    padding: 24px 40px;
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 1;
    flex-wrap: wrap;
  }

  .stat {
    text-align: center;
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
  }
  .stat:nth-child(1) { animation-delay: 0.4s; }
  .stat:nth-child(2) { animation-delay: 0.5s; }
  .stat:nth-child(3) { animation-delay: 0.6s; }
  .stat:nth-child(4) { animation-delay: 0.7s; }

  .stat-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 36px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* Filters */
  .controls {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,12,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 16px 40px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-right: 4px;
  }

  .filter-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.18s ease;
  }

  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .filter-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #0a0a0c;
  }

  .filter-btn.female.active {
    background: var(--female);
    border-color: var(--female);
    color: #fff;
  }

  .filter-btn.male.active {
    background: var(--male);
    border-color: var(--male);
    color: #fff;
  }

  .search-box {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 6px 12px;
  }

  .search-box input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    width: 180px;
  }

  .search-box input::placeholder { color: var(--muted); }

  .search-icon { color: var(--muted); font-size: 14px; }

  /* Main content */
  .content {
    position: relative;
    z-index: 1;
    padding: 32px 40px 80px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* Division block */
  .division {
    margin-bottom: 48px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .division.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .division.hidden { display: none; }

  .division-header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--border);
    position: relative;
  }

  .division-header::before {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 80px;
    height: 2px;
    background: var(--accent);
  }

  .division[data-gender="Female"] .division-header::before { background: var(--female); }
  .division[data-gender="Male"] .division-header::before { background: var(--male); }

  .division-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 32px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text);
  }

  .division-gender-tag {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 2px;
  }

  .division[data-gender="Female"] .division-gender-tag {
    background: rgba(255,110,176,0.15);
    color: var(--female);
    border: 1px solid rgba(255,110,176,0.3);
  }

  .division[data-gender="Male"] .division-gender-tag {
    background: rgba(91,168,255,0.15);
    color: var(--male);
    border: 1px solid rgba(91,168,255,0.3);
  }

  .division-count {
    margin-left: auto;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  /* Results table */
  .results-table {
    width: 100%;
    border-collapse: collapse;
  }

  .results-table thead th {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  .results-table thead th.right { text-align: right; }

  .result-row {
    border-bottom: 1px solid rgba(34,34,48,0.6);
    transition: background 0.15s ease;
  }

  .result-row:hover { background: var(--surface2); }

  .result-row.hidden { display: none; }

  .result-row td {
    padding: 10px 12px;
    font-size: 14px;
    vertical-align: middle;
  }

  /* Place column */
  .td-place {
    width: 52px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 18px;
    font-weight: 800;
    text-align: right;
    padding-right: 20px !important;
  }

  .place-1 { color: var(--gold); }
  .place-2 { color: var(--silver); }
  .place-3 { color: var(--bronze); }
  .place-other { color: var(--muted); }

  /* Medal icons for top 3 */
  .medal {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    font-weight: 900;
  }

  .medal-1 { background: rgba(245,200,66,0.15); border: 1.5px solid var(--gold); color: var(--gold); }
  .medal-2 { background: rgba(192,200,216,0.12); border: 1.5px solid var(--silver); color: var(--silver); }
  .medal-3 { background: rgba(217,122,58,0.15); border: 1.5px solid var(--bronze); color: var(--bronze); }

  /* Name column */
  .td-name {
    font-weight: 500;
    font-size: 15px;
    color: var(--text);
    min-width: 180px;
  }

  .td-name.top-3 { font-weight: 600; }

  /* Time column */
  .td-time {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-align: right;
    color: var(--text);
    min-width: 120px;
  }

  .td-time.top-1 { color: var(--gold); font-size: 20px; }
  .td-time.top-2 { color: var(--silver); }
  .td-time.top-3 { color: var(--bronze); }

  /* Gap indicator */
  .td-gap {
    text-align: right;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    color: var(--muted);
    min-width: 80px;
  }

  /* Bib */
  .td-bib {
    font-size: 12px;
    color: var(--muted);
    width: 60px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  /* Team column */
  .td-team {
    font-size: 13px;
    color: var(--muted);
    min-width: 150px;
  }

  /* Time bar */
  .time-bar-cell {
    width: 120px;
    padding-right: 16px !important;
  }

  .time-bar-bg {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .time-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--accent2);
    transition: width 0.6s ease;
  }

  .result-row:nth-child(1) .time-bar-fill,
  .result-row:nth-child(2) .time-bar-fill,
  .result-row:nth-child(3) .time-bar-fill {
    background: var(--accent);
  }

  /* No results message */
  .no-results {
    text-align: center;
    padding: 60px;
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: none;
  }

  /* Scroll to top */
  .scroll-top {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 44px;
    height: 44px;
    background: var(--accent);
    color: #0a0a0c;
    border: none;
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 999;
    font-weight: 900;
    border-radius: 2px;
  }

  .scroll-top.visible { opacity: 1; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 768px) {
    .hero { padding: 40px 20px 28px; }
    .controls { padding: 12px 20px; }
    .content { padding: 24px 20px 60px; }
    .stats-bar { gap: 24px; padding: 16px 20px; }
    .td-bib, .td-gap, .time-bar-cell { display: none; }
    .search-box { display: none; }
    .search-box input { width: 120px; }
  }
</style>
</head>

    {place:67,bib:597,name:"Jesus Maldonado",time:"00:14:32.0",team:"Hawkins"},
    {place:68,bib:272,name:"Addison Naegeli",time:"00:14:35.1",team:"Brighton PS"},
    {place:69,bib:435,name:"Charlie Prins",time:"00:14:42.1",team:"Stockdale"},
    {place:70,bib:534,name:"Reid Schrieber",time:"00:14:44.4",team:"Dale Road"}
  ]}
];

function timeToSeconds(t) {
  const parts = t.split(':');
  return parseInt(parts[0])*3600 + parseInt(parts[1])*60 + parseFloat(parts[2]);
}

function formatGap(baseSec, curSec) {
  const diff = curSec - baseSec;
  if (diff <= 0) return '';
  if (diff < 60) return `+${diff.toFixed(1)}s`;
  const m = Math.floor(diff/60), s = (diff%60).toFixed(1);
  return `+${m}m ${s}s`;
}

function formatTime(t) {
  // strip leading zeros from hours
  const parts = t.split(':');
  const mm = parts[1], ss = parts[2];
  return `${mm}:${ss}`;
}

// Count unique schools
const allSchools = new Set();
let totalAthletes = 0;
let fastestSec = Infinity;
let fastestTime = '';

rawData.forEach(div => {
  div.results.forEach(r => {
    allSchools.add(r.team);
    totalAthletes++;
    const s = timeToSeconds(r.time);
    if (s < fastestSec && s < 3600) {
      fastestSec = s;
      fastestTime = formatTime(r.time);
    }
  });
});

// Animate stats
function animateCount(el, target, suffix='') {
  let start = 0;
  const dur = 1200;
  const step = (ts) => {
    if (!start) start = ts;
    const prog = Math.min((ts - start) / dur, 1);
    const ease = 1 - Math.pow(1 - prog, 3);
    el.textContent = Math.round(ease * target) + suffix;
    if (prog < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

setTimeout(() => {
  animateCount(document.getElementById('stat-athletes'), totalAthletes);
  animateCount(document.getElementById('stat-schools'), allSchools.size);
  document.getElementById('stat-fastest').textContent = fastestTime;
}, 600);

// Build DOM
const container = document.getElementById('divisions-container');

rawData.forEach((div, idx) => {
  const genderLabel = div.gender;
  const winnerSec = timeToSeconds(div.results[0].time);
  const slowestSec = timeToSeconds(div.results[div.results.length - 1].time);
  const range = Math.min(slowestSec, winnerSec + 300) - winnerSec;

  const divEl = document.createElement('div');
  divEl.className = 'division';
  divEl.dataset.div = div.division;
  divEl.dataset.gender = div.gender;

  let rowsHTML = '';
  div.results.forEach(r => {
    const sec = timeToSeconds(r.time);
    const pClass = r.place === 1 ? 'place-1' : r.place === 2 ? 'place-2' : r.place === 3 ? 'place-3' : 'place-other';
    const medalHTML = r.place <= 3
      ? `<span class="medal medal-${r.place}">${r.place}</span>`
      : `<span class="${pClass}">${r.place}</span>`;
    const nameClass = r.place <= 3 ? 'td-name top-3' : 'td-name';
    const timeClass = r.place === 1 ? 'td-time top-1' : r.place === 2 ? 'td-time top-2' : r.place === 3 ? 'td-time top-3' : 'td-time';
    const gap = r.place === 1 ? '' : formatGap(winnerSec, sec);
    const barPct = Math.max(0, Math.min(100, 100 - ((sec - winnerSec) / (range || 1)) * 100));
    const timeDisplay = sec > 3600 ? r.time : formatTime(r.time);
    const barColor = r.place <= 3 ? 'var(--accent)' : genderLabel === 'Female' ? 'rgba(255,110,176,0.7)' : 'rgba(91,168,255,0.7)';

    rowsHTML += `
      <tr class="result-row" data-name="${r.name.toLowerCase()}" data-team="${r.team.toLowerCase()}">
        <td class="td-place">${medalHTML}</td>
        <td class="${nameClass}">${r.name}</td>
        <td class="td-team">${r.team}</td>
        <td class="${timeClass}">${timeDisplay}</td>
        <td class="td-gap">${gap}</td>
        <td class="time-bar-cell">
          <div class="time-bar-bg"><div class="time-bar-fill" style="width:${barPct}%;background:${barColor}"></div></div>
        </td>
        <td class="td-bib">#${r.bib}</td>
      </tr>`;
  });

  divEl.innerHTML = `
    <div class="division-header">
      <div class="division-name">Grade ${div.division}</div>
      <span class="division-gender-tag">${div.gender}</span>
      <div class="division-count">${div.results.length} athletes</div>
    </div>
    <table class="results-table">
      <thead>
        <tr>
          <th class="right">Place</th>
          <th>Name</th>
          <th>School</th>
          <th class="right">Time</th>
          <th class="right">Gap</th>
          <th></th>
          <th>Bib</th>
        </tr>
      </thead>
      <tbody>${rowsHTML}</tbody>
    </table>`;

  container.appendChild(divEl);
  setTimeout(() => divEl.classList.add('visible'), 100 + idx * 60);
});

// Filtering
let activeDiv = 'all';
let activeGender = 'all';
let searchTerm = '';

function applyFilters() {
  const divEls = document.querySelectorAll('.division');
  let anyVisible = false;

  divEls.forEach(el => {
    const divMatch = activeDiv === 'all' || el.dataset.div === activeDiv;
    const genderMatch = activeGender === 'all' || el.dataset.gender === activeGender;

    if (!divMatch || !genderMatch) {
      el.classList.add('hidden');
      return;
    }

    // Apply search within rows
    let divHasVisible = false;
    if (searchTerm) {
      el.querySelectorAll('.result-row').forEach(row => {
        const nameMatch = row.dataset.name.includes(searchTerm);
        const teamMatch = row.dataset.team.includes(searchTerm);
        if (nameMatch || teamMatch) {
          row.classList.remove('hidden');
          divHasVisible = true;
        } else {
          row.classList.add('hidden');
        }
      });
    } else {
      el.querySelectorAll('.result-row').forEach(row => row.classList.remove('hidden'));
      divHasVisible = true;
    }

    if (divHasVisible) {
      el.classList.remove('hidden');
      anyVisible = true;
    } else {
      el.classList.add('hidden');
    }
  });

  document.getElementById('no-results').style.display = anyVisible ? 'none' : 'block';
}

document.getElementById('div-filters').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('#div-filters .filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeDiv = e.target.dataset.div;
  applyFilters();
});

document.getElementById('gender-filters').addEventListener('click', e => {
  if (!e.target.matches('.filter-btn')) return;
  document.querySelectorAll('#gender-filters .filter-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  activeGender = e.target.dataset.gender;
  applyFilters();
});

document.getElementById('search-input').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase().trim();
  applyFilters();
});

// Scroll to top
window.addEventListener('scroll', () => {
  const btn = document.getElementById('scroll-top');
  btn.classList.toggle('visible', window.scrollY > 400);
});
</script>
