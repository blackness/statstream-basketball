<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Amy Moves">
<meta name="theme-color" content="#0D0F0E">
<title>Amy Moves</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%;
  height: 100%;
  background: #0D0F0E;
  overflow: hidden;
}

.shell {
  font-family: 'Inter', sans-serif;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  background: #0D0F0E;
  display: grid;
  grid-template-rows: auto 1fr auto;
  color: #fff;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

/* ═══ TOP ═══ */
.top {
  padding: 2rem 2rem 1.2rem;
  position: relative;
  overflow: hidden;
}
.top-orb {
  position: absolute;
  width: 280px; height: 280px; border-radius: 50%;
  background: #3D6B45; opacity: 0.18;
  top: -120px; right: -80px;
}
.top-orb2 {
  position: absolute;
  width: 130px; height: 130px; border-radius: 50%;
  background: #9E6E52; opacity: 0.15;
  top: 30px; right: 50px;
}
.top-inner { position: relative; z-index: 1; }

.salutation {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-weight: 300;
  font-size: 20px;
  color: rgba(255,255,255,0.38);
  letter-spacing: 0.02em;
  margin-bottom: 2px;
}
.big-name {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 600;
  font-size: 64px;
  line-height: 0.9;
  color: #fff;
  letter-spacing: -0.01em;
}
.top-date {
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.28);
  margin-top: 10px;
}

.streak-row {
  display: flex;
  align-items: center;
  margin-top: 1.4rem;
  gap: 0;
}
.streak-block { flex: 1; }
.streak-big {
  font-family: 'Cormorant Garamond', serif;
  font-size: 52px;
  font-weight: 600;
  line-height: 1;
  color: #7EC88A;
}
.streak-sub {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-top: 2px;
}
.week-dots { display: flex; gap: 7px; align-items: center; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.wd-label { font-size: 10px; font-weight: 400; color: rgba(255,255,255,0.28); letter-spacing: 0.04em; }
.wd-circle {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: rgba(255,255,255,0.3); font-weight: 300;
  transition: all 0.25s;
}
.wd-circle.done { background: #7EC88A; border-color: #7EC88A; color: #0D0F0E; font-size: 13px; font-weight: 500; }
.wd-circle.today { border-color: #7EC88A; color: rgba(255,255,255,0.7); }
.wd-circle.today.done { color: #0D0F0E; }

/* ═══ MID ═══ */
.mid {
  padding: 0 1.5rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  min-height: 0;
}

.sport-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 10px;
  flex: 1;
  min-height: 0;
}

.sport-card {
  background: #161A18;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  padding: 14px 8px;
  transition: all 0.18s;
  user-select: none;
}
.sport-card:active { transform: scale(0.94); }
.sport-card.selected { background: #1E3D25; border-color: #7EC88A; }
.sport-icon { font-size: 36px; line-height: 1; }
.sport-name { font-size: 13px; font-weight: 400; color: rgba(255,255,255,0.45); }
.sport-card.selected .sport-name { color: #7EC88A; font-weight: 500; }

.dur-wrap {
  background: #161A18;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 18px;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}
.dur-label { font-size: 13px; color: rgba(255,255,255,0.35); white-space: nowrap; font-weight: 300; }
.dur-slider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 3px;
  background: rgba(255,255,255,0.12);
  border-radius: 2px;
  outline: none;
}
.dur-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: #7EC88A;
  cursor: pointer;
  border: 3px solid #0D0F0E;
}
.dur-slider::-moz-range-thumb {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: #7EC88A;
  cursor: pointer;
  border: 3px solid #0D0F0E;
}
.dur-value {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px; font-weight: 600;
  color: #fff;
  min-width: 52px; text-align: right; line-height: 1;
}

/* ═══ BOTTOM ═══ */
.bottom {
  padding: 0 1.5rem 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}

.log-btn {
  width: 100%;
  padding: 19px;
  border-radius: 20px;
  border: none;
  background: #7EC88A;
  color: #0D0F0E;
  font-family: 'Inter', sans-serif;
  font-size: 17px;
  font-weight: 500;
  cursor: pointer;
  letter-spacing: 0.01em;
  transition: all 0.18s;
  -webkit-appearance: none;
}
.log-btn:active { transform: scale(0.97); background: #5FAD6C; }
.log-btn:disabled {
  background: #161A18;
  color: rgba(255,255,255,0.2);
  cursor: default;
  border: 1px solid rgba(255,255,255,0.07);
  transform: none;
}
.log-btn.done-state {
  background: #1E3D25;
  color: #7EC88A;
  border: 1px solid rgba(126,200,138,0.4);
}

.stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.stat-pill {
  background: #161A18;
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 16px;
  padding: 12px 8px;
  text-align: center;
}
.stat-pill .sp-n {
  font-family: 'Cormorant Garamond', serif;
  font-size: 30px; font-weight: 600; color: #fff; line-height: 1;
}
.stat-pill .sp-l {
  font-size: 10px; color: rgba(255,255,255,0.28); font-weight: 300;
  text-transform: uppercase; letter-spacing: 0.1em; margin-top: 3px;
}

.coach-strip {
  background: #1A150F;
  border: 1px solid rgba(159,110,82,0.25);
  border-radius: 18px;
  padding: 13px 18px;
  position: relative;
  overflow: hidden;
}
.coach-strip::before {
  content: '\201C';
  position: absolute;
  font-family: 'Cormorant Garamond', serif;
  font-size: 90px; color: rgba(158,110,82,0.12);
  top: -14px; right: 10px; line-height: 1; font-weight: 600;
}
.coach-eyebrow {
  font-size: 10px; font-weight: 500; letter-spacing: 0.12em;
  text-transform: uppercase; color: #C8956A; margin-bottom: 5px;
}
.coach-msg {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px; font-style: italic; font-weight: 300;
  color: rgba(255,255,255,0.72); line-height: 1.5;
  position: relative; z-index: 1;
}

/* confetti */
.conf-host { position: fixed; inset: 0; pointer-events: none; z-index: 999; overflow: hidden; }
.cp { position: absolute; animation: cpfall linear forwards; }
@keyframes cpfall { to { transform: translateY(110vh) rotate(600deg); opacity: 0; } }

/* install banner */
.install-banner {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom) + 80px);
  left: 50%; transform: translateX(-50%);
  background: #1E3D25;
  border: 1px solid rgba(126,200,138,0.35);
  border-radius: 16px;
  padding: 12px 20px;
  font-size: 13px;
  color: rgba(255,255,255,0.75);
  text-align: center;
  max-width: 300px;
  width: calc(100% - 3rem);
  z-index: 100;
  animation: slideup 0.4s ease;
  line-height: 1.5;
}
.install-banner strong { color: #7EC88A; font-weight: 500; }
.install-close {
  display: block; margin-top: 8px;
  font-size: 12px; color: rgba(255,255,255,0.35);
  cursor: pointer; text-decoration: underline;
}
@keyframes slideup { from { opacity:0; transform: translateX(-50%) translateY(20px); } }
</style>
</head>
<body>

<div class="shell">
  <div class="top">
    <div class="top-orb"></div>
    <div class="top-orb2"></div>
    <div class="top-inner">
      <div class="salutation">good to see you,</div>
      <div class="big-name">Amy.</div>
      <div class="top-date" id="topDate">—</div>
      <div class="streak-row">
        <div class="streak-block">
          <div class="streak-big" id="streakNum">0</div>
          <div class="streak-sub">day streak</div>
        </div>
        <div class="week-dots" id="weekDots"></div>
      </div>
    </div>
  </div>

  <div class="mid">
    <div class="sport-grid">
      <div class="sport-card" data-type="Running"    data-icon="🏃‍♀️" onclick="pick(this)">
        <span class="sport-icon">🏃‍♀️</span><span class="sport-name">Running</span>
      </div>
      <div class="sport-card" data-type="Weights"    data-icon="🏋️‍♀️" onclick="pick(this)">
        <span class="sport-icon">🏋️‍♀️</span><span class="sport-name">Weights</span>
      </div>
      <div class="sport-card" data-type="Jumping"    data-icon="🤸‍♀️" onclick="pick(this)">
        <span class="sport-icon">🤸‍♀️</span><span class="sport-name">Jumping</span>
      </div>
      <div class="sport-card" data-type="Stretching" data-icon="🧘‍♀️" onclick="pick(this)">
        <span class="sport-icon">🧘‍♀️</span><span class="sport-name">Stretching</span>
      </div>
      <div class="sport-card" data-type="Walking"    data-icon="🚶‍♀️" onclick="pick(this)">
        <span class="sport-icon">🚶‍♀️</span><span class="sport-name">Walking</span>
      </div>
      <div class="sport-card" data-type="Cycling"    data-icon="🚴‍♀️" onclick="pick(this)">
        <span class="sport-icon">🚴‍♀️</span><span class="sport-name">Cycling</span>
      </div>
    </div>

    <div class="dur-wrap">
      <span class="dur-label">Duration</span>
      <input type="range" class="dur-slider" min="5" max="120" step="5" value="30" id="durSlider"
        oninput="document.getElementById('durValue').textContent=this.value+'m'">
      <span class="dur-value" id="durValue">30m</span>
    </div>
  </div>

  <div class="bottom">
    <button class="log-btn" id="logBtn" onclick="logWorkout()" disabled>select a workout</button>
    <div class="stats-row">
      <div class="stat-pill"><div class="sp-n" id="sTotal">0</div><div class="sp-l">total</div></div>
      <div class="stat-pill"><div class="sp-n" id="sMins">0</div><div class="sp-l">minutes</div></div>
      <div class="stat-pill"><div class="sp-n" id="sWeek">0</div><div class="sp-l">this week</div></div>
    </div>
    <div class="coach-strip">
      <div class="coach-eyebrow">your coach</div>
      <div class="coach-msg" id="coachMsg">Log a workout — I'll write you a personal note.</div>
    </div>
  </div>
</div>

<div class="conf-host" id="confHost"></div>

<script>
const KEY = 'amy-workout-app-v1';
let state = { workouts: [], bestStreak: 0 };
let sel = null, selIcon = null;
const DAYS = ['Su','Mo','Tu','We','Th','Fr','Sa'];
const CC = ['#7EC88A','#3D6B45','#C8956A','#9E6E52','#ffffff','#B8D4BB'];

const API_KEY = 'YOUR_ANTHROPIC_API_KEY';

function today() { return new Date().toISOString().slice(0,10); }

function load() {
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) state = JSON.parse(saved);
  } catch(e) {}
  render();
  maybeShowInstallTip();
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
}

function streak() {
  const dates = [...new Set(state.workouts.map(w=>w.date))].sort().reverse();
  if (!dates.length) return 0;
  let s = 0, d = new Date();
  for (let i = 0; i < 365; i++) {
    const ds = d.toISOString().slice(0,10);
    if (dates.includes(ds)) { s++; d.setDate(d.getDate()-1); }
    else if (i === 0) { d.setDate(d.getDate()-1); continue; }
    else break;
  }
  return s;
}

function workedToday() { return state.workouts.some(w => w.date === today()); }

function render() {
  const now = new Date();
  document.getElementById('topDate').textContent =
    now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase();

  const s = streak();
  if (s > (state.bestStreak||0)) state.bestStreak = s;
  document.getElementById('streakNum').textContent = s;

  const todayDay = now.getDay();
  const sun = new Date(now); sun.setDate(now.getDate() - todayDay);
  const wd = document.getElementById('weekDots');
  wd.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(sun); d.setDate(sun.getDate()+i);
    const ds = d.toISOString().slice(0,10);
    const done = state.workouts.some(w => w.date === ds);
    const isToday = ds === today();
    const pip = document.createElement('div'); pip.className = 'wd';
    pip.innerHTML = `<span class="wd-label">${DAYS[i]}</span>
      <div class="wd-circle${done?' done':''}${isToday?' today':''}">${done?'✓':d.getDate()}</div>`;
    wd.appendChild(pip);
  }

  const total = state.workouts.length;
  const mins = state.workouts.reduce((a,w)=>a+w.duration, 0);
  const endSun = new Date(sun); endSun.setDate(sun.getDate()+6);
  const wk = state.workouts.filter(w =>
    w.date >= sun.toISOString().slice(0,10) &&
    w.date <= endSun.toISOString().slice(0,10)).length;
  document.getElementById('sTotal').textContent = total;
  document.getElementById('sMins').textContent = mins;
  document.getElementById('sWeek').textContent = wk;

  const btn = document.getElementById('logBtn');
  if (workedToday()) {
    btn.textContent = "today's done ✓"; btn.disabled = true; btn.className = 'log-btn done-state';
  } else if (!sel) {
    btn.textContent = 'select a workout'; btn.disabled = true; btn.className = 'log-btn';
  } else {
    btn.textContent = `log ${selIcon} ${sel}`; btn.disabled = false; btn.className = 'log-btn';
  }
}

function pick(card) {
  document.querySelectorAll('.sport-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  sel = card.dataset.type; selIcon = card.dataset.icon;
  render();
}

async function logWorkout() {
  if (!sel || workedToday()) return;
  const dur = parseInt(document.getElementById('durSlider').value);
  const w = { type: sel, icon: selIcon, duration: dur, date: today() };
  state.workouts.push(w);
  save(); render(); burst(); getAI(w);
}

async function getAI(w) {
  const el = document.getElementById('coachMsg');
  el.style.opacity = '0.4'; el.textContent = 'Writing your note…';
  const s = streak(), total = state.workouts.length;

  if (API_KEY === 'YOUR_ANTHROPIC_API_KEY') {
    el.style.opacity = '1';
    const msgs = [
      `Amy, ${w.duration} minutes of ${w.type} is real progress — your future self thanks you.`,
      `That ${w.type} session just added to a ${s}-day streak. You're building something, Amy.`,
      `${w.duration} minutes well spent, Amy. Consistency like this is what changes everything.`,
    ];
    el.textContent = msgs[Math.floor(Math.random()*msgs.length)];
    return;
  }

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({
        model: 'claude-opus-4-6',
        max_tokens: 120,
        messages: [{ role:'user', content:`You are Amy's warm personal fitness coach. She just logged ${w.duration} minutes of ${w.type}. Her current streak is ${s} day(s) and she has ${total} total workouts. Write exactly 2 sentences — personal, specific to the workout, warm but not over the top. Address her by name. No exclamation marks. Elegant tone.` }]
      })
    });
    const data = await res.json();
    el.style.opacity = '1';
    el.textContent = data.content?.[0]?.text || `Well done today, Amy.`;
  } catch(e) {
    el.style.opacity = '1';
    el.textContent = `Amy, ${w.duration} minutes of ${w.type} — that's a real commitment to yourself.`;
  }
}

function burst() {
  const host = document.getElementById('confHost'); host.innerHTML = '';
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div'); el.className = 'cp';
    const sz = Math.random()*9+4;
    el.style.cssText = `left:${Math.random()*100}%;top:-14px;width:${sz}px;height:${sz}px;background:${CC[Math.floor(Math.random()*CC.length)]};border-radius:${Math.random()>.5?'50%':'3px'};animation-duration:${1+Math.random()*1.4}s;animation-delay:${Math.random()*0.5}s;opacity:1;`;
    host.appendChild(el); setTimeout(()=>el.remove(), 3000);
  }
}

function maybeShowInstallTip() {
  if (localStorage.getItem('install-tip-shown')) return;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isAndroid = /android/i.test(navigator.userAgent);
  if (!isIOS && !isAndroid) return;
  localStorage.setItem('install-tip-shown', '1');
  const banner = document.createElement('div');
  banner.className = 'install-banner';
  if (isIOS) {
    banner.innerHTML = `Tap <strong>Share</strong> then <strong>"Add to Home Screen"</strong> to install Amy Moves as an app.<span class="install-close" onclick="this.parentElement.remove()">got it</span>`;
  } else {
    banner.innerHTML = `Tap the <strong>menu (⋮)</strong> then <strong>"Add to Home Screen"</strong> to install Amy Moves as an app.<span class="install-close" onclick="this.parentElement.remove()">got it</span>`;
  }
  document.body.appendChild(banner);
  setTimeout(() => banner.remove(), 8000);
}

load();
</script>
</body>
</html>
