<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HYROX PETERBOROUGH — APRIL 19, 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Archivo:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --bg-2: #111114;
    --bg-3: #1a1a1f;
    --line: #26262d;
    --text: #f5f5f0;
    --dim: #888892;
    --accent: #d4ff00;     /* electric lime */
    --accent-2: #ff3d2e;   /* hyrox-red */
    --gold: #ffc83d;
    --silver: #c8c8d0;
    --bronze: #d97f3a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Archivo', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(212,255,0,0.06), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,61,46,0.05), transparent 45%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px);
    pointer-events: none;
    z-index: 1;
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px 28px 80px;
  }

  /* HEADER */
  header.hero {
    border-bottom: 1px solid var(--line);
    padding-bottom: 28px;
    margin-bottom: 36px;
    position: relative;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 24px;
  }

  .meta-row .dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--accent-2);
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(255,61,46,0.5); }
    50% { opacity: 0.6; box-shadow: 0 0 0 6px rgba(255,61,46,0); }
  }

  h1.title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(56px, 12vw, 180px);
    line-height: 0.85;
    letter-spacing: -0.01em;
    color: var(--text);
    margin: 0;
  }
  h1.title .accent { color: var(--accent); }
  h1.title .strike {
    -webkit-text-stroke: 1.5px var(--text);
    color: transparent;
  }

  .subtitle {
    margin-top: 18px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .subtitle .stat-num {
    display: block;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    color: var(--text);
    letter-spacing: 0;
    margin-bottom: 2px;
    line-height: 1;
  }
  .subtitle .stat-num.lime { color: var(--accent); }
  .subtitle .stat-num.red { color: var(--accent-2); }

  /* CATEGORY NAV */
  .cat-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 36px;
  }
  .cat-nav button {
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--dim);
    padding: 10px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .cat-nav button:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .cat-nav button.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
    font-weight: 700;
  }

  /* CATEGORY SECTION */
  .category {
    display: none;
    animation: fadeIn 0.4s ease;
  }
  .category.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .cat-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 2px solid var(--text);
    padding-bottom: 12px;
    margin-bottom: 24px;
  }
  .cat-header h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(38px, 6vw, 64px);
    letter-spacing: 0.01em;
    line-height: 1;
  }
  .cat-header .count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--dim);
    text-transform: uppercase;
  }

  /* PODIUM */
  .podium {
    display: grid;
    grid-template-columns: 1fr 1.2fr 1fr;
    gap: 14px;
    margin-bottom: 40px;
  }
  .podium-card {
    background: var(--bg-2);
    border: 1px solid var(--line);
    padding: 22px 20px;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s ease;
  }
  .podium-card:hover { transform: translateY(-3px); }
  .podium-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .podium-card.gold::before { background: var(--gold); }
  .podium-card.silver::before { background: var(--silver); }
  .podium-card.bronze::before { background: var(--bronze); }

  .podium-card.gold {
    background: linear-gradient(180deg, rgba(255,200,61,0.08), transparent 60%), var(--bg-2);
    transform: translateY(-12px);
  }
  .podium-card.gold:hover { transform: translateY(-15px); }

  .podium-rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 80px;
    line-height: 0.85;
    color: var(--text);
    margin-bottom: 4px;
  }
  .podium-card.gold .podium-rank { color: var(--gold); font-size: 96px; }
  .podium-card.silver .podium-rank { color: var(--silver); }
  .podium-card.bronze .podium-rank { color: var(--bronze); }

  .podium-medal {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 16px;
    color: var(--dim);
  }
  .podium-card.gold .podium-medal { color: var(--gold); }
  .podium-card.silver .podium-medal { color: var(--silver); }
  .podium-card.bronze .podium-medal { color: var(--bronze); }

  .podium-name {
    font-family: 'Archivo', sans-serif;
    font-weight: 900;
    font-size: 18px;
    line-height: 1.15;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: -0.005em;
  }
  .podium-name.partner {
    font-size: 14px;
    color: var(--dim);
    font-weight: 700;
    margin-top: 2px;
  }

  .podium-time {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .podium-card.gold .podium-time { color: var(--gold); font-size: 32px; }

  .podium-bib {
    position: absolute;
    top: 16px;
    right: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--dim);
  }

  /* RESULTS TABLE */
  .table-shell {
    background: var(--bg-2);
    border: 1px solid var(--line);
    overflow: hidden;
  }

  .table-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-3);
  }
  .table-toolbar h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .table-toolbar .legend {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.1em;
  }
  .table-toolbar .legend span.lime-tag {
    color: var(--accent);
    font-weight: 700;
  }

  .scroll-x {
    overflow-x: auto;
  }
  .scroll-x::-webkit-scrollbar { height: 8px; }
  .scroll-x::-webkit-scrollbar-track { background: var(--bg-3); }
  .scroll-x::-webkit-scrollbar-thumb { background: var(--line); }
  .scroll-x::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  table.results {
    width: 100%;
    border-collapse: collapse;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    min-width: 1200px;
  }
  table.results thead th {
    background: var(--bg-3);
    color: var(--dim);
    font-weight: 500;
    text-align: left;
    padding: 12px 10px;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    position: sticky;
    top: 0;
    cursor: pointer;
    user-select: none;
    transition: color 0.15s ease, background 0.15s ease;
  }
  table.results thead th:hover {
    color: var(--text);
    background: #1f1f25;
  }
  table.results thead th .sort-ind {
    display: inline-block;
    margin-left: 6px;
    color: var(--line);
    font-size: 9px;
    transition: color 0.15s ease;
  }
  table.results thead th:hover .sort-ind {
    color: var(--dim);
  }
  table.results thead th.sorted {
    color: var(--accent);
    background: #1f1f25;
    border-bottom: 1px solid var(--accent);
  }
  table.results thead th.sorted .sort-ind {
    color: var(--accent);
  }
  table.results tbody td {
    padding: 12px 10px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
    color: var(--text);
  }
  table.results tbody tr:hover { background: rgba(212,255,0,0.04); }

  table.results .place {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--text);
    width: 50px;
  }
  table.results tr.top-1 .place { color: var(--gold); }
  table.results tr.top-2 .place { color: var(--silver); }
  table.results tr.top-3 .place { color: var(--bronze); }

  table.results .name-cell {
    font-family: 'Archivo', sans-serif;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  table.results .name-cell.partner {
    font-weight: 500;
    color: var(--dim);
    font-size: 12px;
  }

  table.results .total {
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
  }
  table.results tr.top-1 .total { color: var(--gold); }
  table.results .bib {
    color: var(--dim);
    width: 45px;
  }

  /* Highlight fastest split per column */
  table.results td.fastest {
    color: var(--accent);
    font-weight: 700;
    background: rgba(212,255,0,0.06);
  }

  .pair-row td {
    border-bottom: none !important;
  }
  .pair-row + .pair-row td {
    border-bottom: 1px solid var(--line) !important;
    padding-top: 4px;
    padding-bottom: 12px;
  }
  .pair-row.first td {
    padding-top: 12px;
    padding-bottom: 4px;
  }

  /* FOOTER */
  footer {
    margin-top: 60px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--dim);
    text-transform: uppercase;
  }
  footer .ascii {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
  }

  /* RESPONSIVE */
  @media (max-width: 720px) {
    .subtitle { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .podium { grid-template-columns: 1fr; }
    .podium-card.gold { transform: none; }
    .podium-card.gold:hover { transform: translateY(-3px); }
    .cat-header { flex-direction: column; align-items: flex-start; gap: 6px; }
    footer { flex-direction: column; gap: 10px; align-items: flex-start; }
  }

  /* tag stripe */
  .tag-stripe {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: var(--bg);
    padding: 6px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .tag-stripe.red { background: var(--accent-2); color: var(--text); }

</style>
</head>

// ============ HELPERS ============
function timeToSeconds(t) {
  if (!t || t === "—") return Infinity;
  const parts = t.split(":").map(Number);
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  return parts[0]*60 + parts[1];
}

function findFastestPerStation(athletes, type) {
  const fastest = STATIONS.map(() => Infinity);
  const allRows = [];
  if (type === "solo") {
    athletes.forEach(a => allRows.push(a.splits));
  } else {
    athletes.forEach(p => p.members.forEach(m => allRows.push(m.splits)));
  }
  allRows.forEach(splits => {
    splits.forEach((s, i) => {
      const sec = timeToSeconds(s);
      if (sec < fastest[i]) fastest[i] = sec;
    });
  });
  return fastest;
}

// Track sort state per category. Default: sort by Total ascending.
// columnKey values: "place", "name", "bib", "total", "split-0" .. "split-15"
const sortState = {};

// Build column metadata: identifies how to extract a sortable value
const COLUMNS = [
  { key: "place", label: "#",        type: "number" },
  { key: "name",  label: "Athlete",  type: "string" },
  { key: "bib",   label: "Bib",      type: "number" },
  { key: "total", label: "Total",    type: "time"   },
  ...STATIONS.map((s, i) => ({ key: `split-${i}`, label: s, type: "time", splitIndex: i }))
];

// For pair categories: extract the value used to sort the *team* by a given column.
// We pick the BEST (fastest / smallest) value among both members for time/number cols,
// and the alphabetically-first name for string cols. This keeps partners grouped.
function teamSortValue(team, col) {
  if (col.key === "place") return team.place;
  if (col.key === "total") return timeToSeconds(team.total);
  if (col.key === "name")  return team.members.map(m => m.name).sort()[0];
  if (col.key === "bib")   return Math.min(...team.members.map(m => m.bib));
  if (col.key.startsWith("split-")) {
    const i = col.splitIndex;
    return Math.min(...team.members.map(m => timeToSeconds(m.splits[i])));
  }
  return 0;
}

function soloSortValue(athlete, col) {
  if (col.key === "place") return athlete.place;
  if (col.key === "total") return timeToSeconds(athlete.total);
  if (col.key === "name")  return athlete.name;
  if (col.key === "bib")   return athlete.bib;
  if (col.key.startsWith("split-")) return timeToSeconds(athlete.splits[col.splitIndex]);
  return 0;
}

function compareValues(a, b, dir) {
  let cmp;
  if (typeof a === "string" || typeof b === "string") {
    cmp = String(a).localeCompare(String(b));
  } else {
    cmp = a - b;
  }
  return dir === "asc" ? cmp : -cmp;
}

function getSortedAthletes(cat, sortKey, sortDir) {
  const col = COLUMNS.find(c => c.key === sortKey);
  if (!col) return cat.athletes;
  const valueFn = cat.type === "solo" ? soloSortValue : teamSortValue;
  return [...cat.athletes].sort((a, b) =>
    compareValues(valueFn(a, col), valueFn(b, col), sortDir)
  );
}

function renderTable(key, cat) {
  const state = sortState[key];
  const fastest = findFastestPerStation(cat.athletes, cat.type);
  const sortedAthletes = getSortedAthletes(cat, state.key, state.dir);

  // Header with sort indicators
  const headerRow = `
    <tr>
      ${COLUMNS.map(col => {
        const isSorted = col.key === state.key;
        const arrow = isSorted ? (state.dir === "asc" ? "▲" : "▼") : "↕";
        return `<th data-key="${col.key}" class="${isSorted ? 'sorted' : ''}">${col.label}<span class="sort-ind">${arrow}</span></th>`;
      }).join("")}
    </tr>
  `;

  // Rows
  const rowsHTML = sortedAthletes.map(a => {
    const topClass = a.place <= 3 ? `top-${a.place}` : '';
    if (cat.type === "solo") {
      const splitCells = a.splits.map((s, i) => {
        const sec = timeToSeconds(s);
        const cls = sec === fastest[i] && sec !== Infinity ? "fastest" : "";
        return `<td class="${cls}">${s}</td>`;
      }).join("");
      return `
        <tr class="${topClass}">
          <td class="place">${String(a.place).padStart(2,"0")}</td>
          <td class="name-cell">${a.name}</td>
          <td class="bib">#${a.bib}</td>
          <td class="total">${a.total}</td>
          ${splitCells}
        </tr>
      `;
    } else {
      return a.members.map((m, mi) => {
        const splitCells = m.splits.map((s, i) => {
          const sec = timeToSeconds(s);
          const cls = sec === fastest[i] && sec !== Infinity ? "fastest" : "";
          return `<td class="${cls}">${s}</td>`;
        }).join("");
        const isFirst = mi === 0;
        return `
          <tr class="${topClass} pair-row ${isFirst ? 'first' : ''}">
            <td class="place">${isFirst ? String(a.place).padStart(2,"0") : ""}</td>
            <td class="name-cell ${!isFirst ? 'partner' : ''}">${isFirst ? '' : '+ '}${m.name}</td>
            <td class="bib">#${m.bib}</td>
            <td class="total">${isFirst ? a.total : ''}</td>
            ${splitCells}
          </tr>
        `;
      }).join("");
    }
  }).join("");

  return `
    <table class="results">
      <thead>${headerRow}</thead>
      <tbody>${rowsHTML}</tbody>
    </table>
  `;
}

function renderCategory(key, cat) {
  // Init sort state if missing
  if (!sortState[key]) sortState[key] = { key: "place", dir: "asc" };

  // Podium (always reflects original placings — never re-sorted)
  const podiumPlaces = ["gold", "silver", "bronze"];
  const medalLabels = ["1st · GOLD", "2nd · SILVER", "3rd · BRONZE"];
  const ranks = ["01", "02", "03"];

  const top3 = cat.athletes.slice(0, 3);
  const podiumOrder = top3.length === 3 ? [1, 0, 2] : top3.map((_,i)=>i);

  const podiumHTML = `
    <div class="podium">
      ${podiumOrder.map(idx => {
        const a = top3[idx];
        if (!a) return '';
        const placeClass = podiumPlaces[idx];
        if (cat.type === "solo") {
          return `
            <div class="podium-card ${placeClass}">
              <div class="podium-bib">#${a.bib}</div>
              <div class="podium-rank">${ranks[idx]}</div>
              <div class="podium-medal">${medalLabels[idx]}</div>
              <div class="podium-name">${a.name}</div>
              <div class="podium-time">${a.total}</div>
            </div>
          `;
        } else {
          return `
            <div class="podium-card ${placeClass}">
              <div class="podium-bib">#${a.members[0].bib}/${a.members[1].bib}</div>
              <div class="podium-rank">${ranks[idx]}</div>
              <div class="podium-medal">${medalLabels[idx]}</div>
              <div class="podium-name">${a.members[0].name}</div>
              <div class="podium-name partner">+ ${a.members[1].name}</div>
              <div class="podium-time">${a.total}</div>
            </div>
          `;
        }
      }).join("")}
    </div>
  `;

  return `
    <section class="category" id="cat-${key}">
      <span class="tag-stripe">CATEGORY · ${cat.type === "solo" ? "INDIVIDUAL" : "TEAM"}</span>
      <div class="cat-header">
        <h2>${cat.title}</h2>
        <div class="count">${cat.athletes.length} ${cat.type === "solo" ? "ATHLETES" : "TEAMS"} · CLICK ANY HEADER TO SORT</div>
      </div>
      ${podiumHTML}
      <div class="table-shell">
        <div class="table-toolbar">
          <h3>Full Results · All Stations</h3>
          <div class="legend"><span class="lime-tag">■</span> FASTEST SPLIT IN STATION · CLICK COLUMN TO SORT</div>
        </div>
        <div class="scroll-x" id="scroll-${key}">
          ${renderTable(key, cat)}
        </div>
      </div>
    </section>
  `;
}

// Render all categories
const main = document.getElementById("categories");
main.innerHTML = Object.entries(data).map(([key, cat]) => renderCategory(key, cat)).join("");

// Show first by default
document.getElementById("cat-men-solo").classList.add("active");

// Tab switching
document.querySelectorAll("#catNav button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#catNav button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".category").forEach(c => c.classList.remove("active"));
    document.getElementById(`cat-${btn.dataset.cat}`).classList.add("active");
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
});

// Sort handler — delegated
document.getElementById("categories").addEventListener("click", (e) => {
  const th = e.target.closest("th[data-key]");
  if (!th) return;
  const section = th.closest("section.category");
  if (!section) return;
  const key = section.id.replace("cat-", "");
  const cat = data[key];
  const colKey = th.dataset.key;

  const cur = sortState[key];
  if (cur.key === colKey) {
    cur.dir = cur.dir === "asc" ? "desc" : "asc";
  } else {
    cur.key = colKey;
    cur.dir = "asc"; // ascending default — fastest times first, A→Z for names
  }

  // Preserve scroll position
  const scrollEl = document.getElementById(`scroll-${key}`);
  const prevScrollLeft = scrollEl.scrollLeft;
  scrollEl.innerHTML = renderTable(key, cat);
  scrollEl.scrollLeft = prevScrollLeft;
});
</script>
